name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet publish src/PenScroll/PenScroll.csproj -c Release -o publish

      - name: Package
        run: |
          mkdir -p artifacts
          # OpenTabletDriver only looks at the top level of the archive, so no directories here.
          zip -j artifacts/PenScroll.zip publish/PenScroll.dll
          sha256sum artifacts/PenScroll.zip | tee artifacts/PenScroll.zip.sha256

      - name: Report hash
        run: |
          {
            echo '## PenScroll.zip'
            echo
            echo '```'
            cat artifacts/PenScroll.zip.sha256
            echo '```'
            echo
            echo 'Copy the hash into the `SHA256` field of the plugin manifest.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: PenScroll
          path: artifacts/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PenScroll
          path: artifacts

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="$(cut -d' ' -f1 < artifacts/PenScroll.zip.sha256)"
          gh release create "$GITHUB_REF_NAME" artifacts/PenScroll.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "SHA256 of \`PenScroll.zip\`: \`$hash\`"
